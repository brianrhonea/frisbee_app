# Codemagic CI: builds the iOS app on a cloud Mac. Setup steps are in
# docs/ios-release.md.
#
# Monorepo: the Flutter app is in apps/mobile. Scripts run there
# (working_directory). The IPA is listed both from the repo root and from
# apps/mobile: after the move, builds finished green but nothing reached
# TestFlight, as if the artifact path matched nothing and there was nothing
# to upload. "Check the IPA" fails the build if none was made.
# Pushes that only touch apps/api, apps/web, firebase/ or docs (not this
# file) skip the build (when: changeset).
#
#   development branch -> TestFlight, talking to the dev Firebase project
#                         (frisbee-app-brianrhonea-dev)
#   main branch        -> App Store, talking to production
#                         (frisbee-app-brianrhonea)
#
# Secrets never live in this file. Each workflow gets them from its
# Codemagic environment group (base64-encoded, marked Secure):
#   frisbee_secrets_dev / frisbee_secrets (production), each holding
#     SECRETS_LOCAL_JSON         base64 of that project's secrets file
#     GOOGLE_SERVICE_INFO_PLIST  base64 of that project's GoogleService-Info.plist
# and from the App Store Connect API key integration named below.

workflows:
  ios-testflight: &ios
    name: iOS TestFlight (dev)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile
    integrations:
      # Codemagic > Team settings > Integrations > Developer Portal.
      app_store_connect: Frisbee App Store Connect
    environment: &environment
      # Pinned to the version the app is developed and tested on; "stable"
      # moved on and broke compiling the tests. Bump with local Flutter.
      flutter: 3.41.2
      xcode: latest
      cocoapods: default
      groups:
        - frisbee_secrets_dev
      ios_signing:
        # Uses the Apple Distribution certificate and App Store profile in
        # Codemagic > Team settings > codemagic.yaml settings > Code signing
        # identities (see docs/ios-release.md); Codemagic doesn't make them.
        distribution_type: app_store
        bundle_identifier: com.brianrhonea.frisbeeApp
      vars:
        # The app's numeric Apple ID from App Store Connect > App Information.
        APP_STORE_APPLE_ID: "6830314904"
    # Every push to development builds and uploads to TestFlight. A newer
    # push cancels a build still running, to save build minutes.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: development
          include: true
          source: true
      cancel_previous_builds: true
    when: &when
      changeset:
        includes:
          - 'apps/mobile/'
          - 'packages/'
          - 'codemagic.yaml'
    scripts: &scripts
      - name: Write secrets files
        script: |
          set -euo pipefail
          echo "$SECRETS_LOCAL_JSON" | base64 --decode > secrets.local.json
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Google Sign-In config (ios/Flutter/Secrets.xcconfig)
        script: |
          set -euo pipefail
          PLIST=ios/Runner/GoogleService-Info.plist
          {
            echo "GOOGLE_REVERSED_CLIENT_ID = $(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$PLIST")"
            echo "GOOGLE_IOS_CLIENT_ID = $(/usr/libexec/PlistBuddy -c 'Print :CLIENT_ID' "$PLIST")"
          } > ios/Flutter/Secrets.xcconfig
      - name: Code signing
        script: xcode-project use-profiles
      - name: Flutter packages
        script: flutter pub get
      # No Podfile.lock is committed, so pods resolve fresh each build. The
      # build image's cached CocoaPods spec index can lag behind new Firebase
      # pod releases ("specs repository is too out-of-date"), so refresh it.
      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update
      - name: Checks
        script: |
          flutter analyze
          flutter test
      - name: Build IPA
        script: |
          set -euo pipefail
          if [ "$APP_STORE_APPLE_ID" = "0000000000" ]; then
            echo "Set APP_STORE_APPLE_ID in codemagic.yaml to the app's numeric Apple ID" \
              "(App Store Connect > App Information). See docs/ios-release.md." >&2
            exit 1
          fi
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          TESTFLIGHT=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          BUILD_NUMBER=$(( (LATEST > TESTFLIGHT ? LATEST : TESTFLIGHT) + 1 ))
          flutter build ipa --release \
            --dart-define-from-file=secrets.local.json \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Check the IPA
        script: |
          set -euo pipefail
          ls -l build/ios/ipa/*.ipa
    artifacts: &artifacts
      - apps/mobile/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-app-store:
    <<: *ios
    name: iOS App Store (production)
    environment:
      <<: *environment
      groups:
        - frisbee_secrets
    # Every push to main builds against production and submits it for App
    # Store review. Release it by hand in App Store Connect once approved.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: MANUAL
