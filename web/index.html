<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `--base-href` (/ on the website; see
       scripts/build_site.sh). Must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search players, teams, pickup groups, events and rankings on Stall 10.">
  <meta name="theme-color" content="#0e1310">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stall 10">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Stall 10</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown until Flutter draws its first frame. */
    html, body { margin: 0; height: 100%; background: #0e1310; }
    #loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
    }
    #loading img {
      width: 72px; height: 72px; border-radius: 18px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.94); } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt="Loading Stall 10"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
