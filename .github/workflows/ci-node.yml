# Checks the Node workspace (packages/shared, apps/api, apps/web) on every
# push and pull request that touches it. The Flutter app is checked by
# Codemagic; firebase/functions by the deploy workflow.

name: CI (API, web, shared)

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/ci-node.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/ci-node.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stall10/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @stall10/api build
      - run: pnpm --filter @stall10/web build

  api-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stall10/shared build
      - run: npm install -g firebase-tools
      - run: pnpm test:api:emulator

  # The Cloud Run image (apps/api/Dockerfile) builds and serves.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: DOCKER_BUILDKIT=1 docker build -f apps/api/Dockerfile --target api -t stall10-api .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 -e FIREBASE_PROJECT_ID=demo-stall10 stall10-api
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8080/health
          code=$(curl -s -o body.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' localhost:8080/v1/teams)
          cat body.json
          [ "$code" = 401 ] && grep -q '"unauthenticated"' body.json
          [ "$(docker exec api id -u)" != 0 ]
          # SIGTERM: closes cleanly (src/shutdown.ts) with exit code 0.
          docker stop -t 10 api
          docker logs api | tail -5
          [ "$(docker inspect -f '{{.State.ExitCode}}' api)" = 0 ]
