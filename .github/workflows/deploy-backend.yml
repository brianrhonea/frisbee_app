# One-click backend deploy: Actions → "Deploy backend" → Run workflow.
# Each deploy is tagged release-<env>-<time>, so rollback-backend.yml can
# put any earlier one back.

name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase project
        type: choice
        options: [dev, prod]
        default: dev
      ref:
        description: Branch, tag or commit (dev usually deploys development, prod deploys main)
        type: string
        default: development

concurrency:
  group: backend-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      tag: true
    secrets:
      # The && || picks between two non-empty secret NAMES, so an unset prod
      # secret reads as empty (and _deploy-backend.yml stops) instead of
      # falling back to dev's value.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets[inputs.environment == 'prod' && 'FIREBASE_SA_PROD' || 'FIREBASE_SA_DEV'] }}
      FIREBASE_WEB_API_KEY: ${{ secrets[inputs.environment == 'prod' && 'FIREBASE_WEB_API_KEY_PROD' || 'FIREBASE_WEB_API_KEY_DEV'] }}
