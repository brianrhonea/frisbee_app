# Shared by deploy-backend.yml and rollback-backend.yml: deploys the
# Firebase backend (rules, indexes, hosting and the named function groups)
# from one commit to one project.
#
# Monorepo: Firebase lives in firebase/ and the Flutter app in apps/mobile.
# Release tags from before the move (rollbacks) have them at the repo root;
# the Layout step picks the right paths for whichever commit is checked out.
#
# Hosting includes the website's Flutter web app (scripts/build_site.sh,
# run by firebase.json's predeploy). It needs the Firebase web API key as the
# repository secret FIREBASE_WEB_API_KEY_DEV / _PROD (the
# FIREBASE_WINDOWS_API_KEY value from that project's secrets file); without
# it, hosting is skipped with a warning and the rest still deploys.
#
# Change the groups with the repository variable FUNCTION_GROUPS
# (Settings → Secrets and variables → Actions → Variables), e.g. "account,api,browse,communities,discord,follows,meetings,notifications,tournaments".

name: Deploy backend (shared)

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      ref:
        description: Commit, branch or tag to deploy
        required: true
        type: string
      tag:
        description: Tag the deployed commit as a release (false for rollbacks)
        required: true
        type: boolean
      reason:
        required: false
        type: string
        default: ""
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true
      FIREBASE_WEB_API_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Prod needs a reviewer's approval: Settings → Environments → prod →
    # Required reviewers.
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # to push the release tag
    env:
      PROJECT: ${{ inputs.environment }}
      GROUPS: ${{ vars.FUNCTION_GROUPS || 'account,api,browse,communities,discord,follows,meetings,notifications,tournaments' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Layout
        run: |
          if [ -f firebase/firebase.json ]; then
            echo "FB_DIR=firebase" >> "$GITHUB_ENV"
            echo "MOBILE_DIR=apps/mobile" >> "$GITHUB_ENV"
          else
            echo "FB_DIR=." >> "$GITHUB_ENV"
            echo "MOBILE_DIR=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/functions/package-lock.json'

      - name: Build and test functions
        working-directory: ${{ env.FB_DIR }}/functions
        run: |
          npm ci
          npm run build
          npm test

      # For the website (scripts/build_site.sh); older commits don't have it.
      - name: Set up Flutter
        if: hashFiles('scripts/build_site.sh', 'firebase/scripts/build_site.sh') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        env:
          WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          cd "$FB_DIR"
          targets="firestore:rules,firestore:indexes,storage"
          if [ ! -f scripts/build_site.sh ]; then
            targets="$targets,hosting"
          elif [ -z "$WEB_API_KEY" ]; then
            echo "::warning::No FIREBASE_WEB_API_KEY_${PROJECT^^} secret; hosting (the website) left as deployed."
          else
            # The website's build reads the same keys as a local secrets file.
            file=$([ "$PROJECT" = prod ] && echo secrets.prod.local.json || echo secrets.local.json)
            file="$GITHUB_WORKSPACE/$MOBILE_DIR/$file"
            jq -n --arg env "$PROJECT" --arg key "$WEB_API_KEY"               '{FIREBASE_ENV: $env, FIREBASE_WINDOWS_API_KEY: $key}' > "$file"
            targets="$targets,hosting"
          fi
          # Only groups this commit has: an older release may predate one.
          for g in ${GROUPS//,/ }; do
            if grep -q "export \* as $g from" functions/src/index.ts; then
              targets="$targets,functions:$g"
            else
              echo "::notice::functions:$g isn't in this commit; left as deployed."
            fi
          done
          echo "Deploying $targets to $PROJECT"
          npx --yes firebase-tools@latest deploy --project "$PROJECT" \
            --only "$targets" --non-interactive --force

      - name: Tag the release
        if: inputs.tag
        run: |
          tag="release-$PROJECT-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$tag" HEAD
          git push origin "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "### Deployed to \`$PROJECT\`"
            echo ""
            echo "- Commit: \`$(git rev-parse --short HEAD)\` ($(git log -1 --format=%s))"
            echo "- Ref: \`${{ inputs.ref }}\`"
            [ -n "${TAG:-}" ] && echo "- Release tag: \`$TAG\`"
            [ -n "${{ inputs.reason }}" ] && echo "- Reason: ${{ inputs.reason }}"
            echo "- Functions: $GROUPS"
          } >> "$GITHUB_STEP_SUMMARY"
