# Shared by deploy-backend.yml and rollback-backend.yml: deploys the
# Firebase backend (rules, indexes, hosting and the named function groups)
# from one commit to one project.
#
# Never deploys the USA Ultimate scrapers (scrapeUsau*, refreshUsau); they
# stay undeployed on purpose. Change the groups with the repository
# variable FUNCTION_GROUPS (Settings → Secrets and variables → Actions →
# Variables), e.g. "account,api,communities,discord,follows,meetings,notifications".

name: Deploy backend (shared)

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      ref:
        description: Commit, branch or tag to deploy
        required: true
        type: string
      tag:
        description: Tag the deployed commit as a release (false for rollbacks)
        required: true
        type: boolean
      reason:
        required: false
        type: string
        default: ""
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Prod needs a reviewer's approval: Settings → Environments → prod →
    # Required reviewers.
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # to push the release tag
    env:
      PROJECT: ${{ inputs.environment }}
      GROUPS: ${{ vars.FUNCTION_GROUPS || 'account,api,communities,discord,follows,meetings,notifications' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Build and test functions
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm test

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: |
          targets="firestore:rules,firestore:indexes,storage,hosting"
          # Only groups this commit has: an older release may predate one.
          for g in ${GROUPS//,/ }; do
            if grep -q "export \* as $g from" functions/src/index.ts; then
              targets="$targets,functions:$g"
            else
              echo "::notice::functions:$g isn't in this commit; left as deployed."
            fi
          done
          echo "Deploying $targets to $PROJECT"
          npx --yes firebase-tools@latest deploy --project "$PROJECT" \
            --only "$targets" --non-interactive --force

      - name: Tag the release
        if: inputs.tag
        run: |
          tag="release-$PROJECT-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$tag" HEAD
          git push origin "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "### Deployed to \`$PROJECT\`"
            echo ""
            echo "- Commit: \`$(git rev-parse --short HEAD)\` ($(git log -1 --format=%s))"
            echo "- Ref: \`${{ inputs.ref }}\`"
            [ -n "${TAG:-}" ] && echo "- Release tag: \`$TAG\`"
            [ -n "${{ inputs.reason }}" ] && echo "- Reason: ${{ inputs.reason }}"
            echo "- Functions: $GROUPS"
          } >> "$GITHUB_STEP_SUMMARY"
