# The Cloud Run service for the API, one per Firebase project. The deploy
# workflow (.github/workflows/_deploy-api.yml) fills in the ${...} values
# with envsubst and applies it with `gcloud run services replace`, so this
# file is the whole configuration: change it here, not in the console.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    # Public: the API checks Firebase ID tokens itself. Unauthenticated
    # invocation is allowed once per project (apps/api/DEPLOY.md).
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: stall10-api
      annotations:
        # Scale to zero when idle: no requests, no cost.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "${MAX_INSTANCES}"
        # CPU only while handling requests (request-based billing).
        run.googleapis.com/cpu-throttling: "true"
        # Extra CPU while starting, for shorter cold starts.
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ${RUNTIME_SA}
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: FIREBASE_PROJECT_ID
              value: "${PROJECT_ID}"
            - name: ENFORCE_APP_CHECK
              value: "${ENFORCE_APP_CHECK}"
            - name: CORS_ORIGINS
              value: "${CORS_ORIGINS}"
            - name: TRUST_PROXY_HOPS
              value: "1"
            - name: LOG_LEVEL
              value: info
            # Encrypts personal details (DEPLOY.md, setup step 4: the key
            # must exist before /v1/me/personal works).
            - name: PERSONAL_DETAILS_KMS_KEY
              value: "projects/${PROJECT_ID}/locations/us/keyRings/stall10/cryptoKeys/personal-details"
            # The website's server key (x-stall10-web-key), so the API doesn't
            # rate-limit the Next.js server as one visitor. Secret Manager
            # secret `web-server-key` (DEPLOY.md, setup step 4).
            - name: WEB_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: web-server-key
                  key: latest
            # The website (repository variable API_WEB_SITE_URL_<ENV>): with
            # WEB_SERVER_KEY, the API expires its cached public pages the
            # moment they change. Empty: they refresh within a minute.
            - name: WEB_SITE_URL
              value: "${WEB_SITE_URL}"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
