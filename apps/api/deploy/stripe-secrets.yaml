            # Payments on (DEPLOY.md, Payments): Stripe's key and the two webhook
            # signing secrets (Stall 10's own account, and hosts' accounts).
            # Each secret must exist in the project, or the revision fails.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: STRIPE_SECRET_KEY
                  key: latest
            - name: STRIPE_PLATFORM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: STRIPE_PLATFORM_WEBHOOK_SECRET
                  key: latest
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: STRIPE_WEBHOOK_SECRET
                  key: latest
